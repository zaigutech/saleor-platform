services:
  api:
    image: ghcr.nju.edu.cn/saleor/saleor:3.23
    ports:
      - 8000:8000
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      # shared volume between worker and api for media
      - /mnt/data/saleor:/app/media
    env_file:
      - common.env
      - backend.env
      - jwt.env
    environment:
      - DASHBOARD_URL=http://localhost:9000/
      - ALLOWED_HOSTS=localhost,127.0.0.1,api

  dashboard:
    image: ghcr.nju.edu.cn/saleor/saleor-dashboard:3.23
    ports:
      - 9000:80
    restart: unless-stopped

  worker:
    image: ghcr.nju.edu.cn/saleor/saleor:3.23
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    env_file:
      - common.env
      - backend.env
      - jwt.env
    volumes:
      # shared volume between worker and api for media
      - /mnt/data/saleor:/app/media

networks:
  default:
    external: true
    name: zaigu_network
