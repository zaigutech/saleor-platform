# 生产环境专用配置。
#
# 生产：`docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`。
#       显式指定 -f 时 Compose 不会加载开发专用的 docker-compose.override.yml。
# DJANGO_SETTINGS_MODULE 和 settings_fork.py 的挂载在 docker-compose.override.yml 里有同样一份，改动时两边同步。
#
# API 对公网的地址是 https://commerce.zaigu.com，由 caddy 反代（见 docs/operations/deploy.md 的「对外提供 API」）；
# 8000 端口只绑定服务器本机，公网请求只能经过 caddy。

# saleor-api 和 saleor-worker 共用：saleor-worker 也生成媒体地址（webhook 负载）和账户邮件里的链接，加载同一份 settings。
x-production-env: &production-env
  DJANGO_SETTINGS_MODULE: saleor.settings_fork
  # Saleor 默认 DEBUG=True：出错时把调用栈返回给客户端，并由 Django 自己提供 /media/。
  DEBUG: "False"
  PUBLIC_URL: https://commerce.zaigu.com
  # 账户邮件（重置密码等）里允许跳转回的商城域名；租户的商城用自己的域名时加进来。
  ALLOWED_CLIENT_HOSTS: www.zaigu.com
  PLAYGROUND_ENABLED: "False"

services:
  saleor-api:
    ports: !override
      - 127.0.0.1:8000:8000
    environment:
      <<: *production-env
      # saleor-api 是同一网络里的容器（如 eos）用的服务名，localhost 是服务器本机（如 provision-eos.sh）。
      ALLOWED_HOSTS: commerce.zaigu.com,saleor-api,localhost,127.0.0.1
    volumes:
      - ./saleor-settings/settings_fork.py:/app/saleor/settings_fork.py:ro

  saleor-worker:
    environment:
      <<: *production-env
    volumes:
      - ./saleor-settings/settings_fork.py:/app/saleor/settings_fork.py:ro
